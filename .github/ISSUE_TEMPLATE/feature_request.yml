name: Feature Request
description: Suggest an idea for gitforge
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: A clear description of the use case or pain point.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should the tool / behaviour look like?
      placeholder: A new tool called `git_xyz` that …
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative approaches you've tried.
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: What area does this affect?
      options:
        - New git tool
        - MCP protocol / transport
        - Build / CI / release
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: ref
    attributes:
      label: Reference
      description: Link to the Python MCP git server or git CLI docs if relevant.
    validations:
      required: false
