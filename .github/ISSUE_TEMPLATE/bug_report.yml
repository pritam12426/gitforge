name: Bug Report
description: Report a problem with gitforge
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear, concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Steps to reproduce the behaviour.
      placeholder: |
        1. Run '...'
        2. Call tool '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: Run with `--log-level debug` and paste the relevant output.
      render: text

  - type: input
    id: version
    attributes:
      label: gitforge version
      description: Output of `gitforge --version`
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. macOS 15.2, Ubuntu 24.04, Windows 11
    validations:
      required: true

  - type: input
    id: git-version
    attributes:
      label: Git version
      description: Output of `git --version`
    validations:
      required: true

  - type: dropdown
    id: mcp-client
    attributes:
      label: MCP client
      description: Which MCP client are you using?
      options:
        - Not applicable (stdio direct)
        - Claude Desktop
        - Cursor
        - VS Code (GitHub Copilot)
        - Windsurf
        - Continue.dev
        - Other
    validations:
      required: false
