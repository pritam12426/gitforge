[package]
	name = "gitforge"
	version = "0.1.0"
	edition = "2024"

[features]
log-timestamp = []
log-source = []

[dependencies]
	anyhow = "1.0.104"
	clap = { version = "4.6.4", features = ["derive"] }
	git2 = "0.21.0"
	serde = { version = "1.0.229", features = ["derive"] }
	serde_json = "1.0.151"
	thiserror = "2.0.19"
